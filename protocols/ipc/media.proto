syntax = "proto3";
package skyroof.remote.ipc.v1;
option csharp_namespace = "SkyRoof.Remote.Ipc";

service MediaIngress {
  rpc PublishRx(stream RxPcmChunk) returns (RxStreamReceipt);
  rpc PublishIcomRx(stream IcomRxDatagram) returns (RxStreamReceipt);
  rpc GetRxStatus(RxStatusQuery) returns (RxStreamReceipt);
}

message RxPcmChunk {
  uint64 first_sample_index = 1;
  int32 sample_rate = 2;
  int32 samples_per_channel = 3;
  int32 channels = 4;
  bytes pcm16 = 5;
}

// Negotiated session IDs come from the owning authenticated Icom LAN connection.
// Media checks every datagram against the stream's immutable first-packet identity.
message IcomRxDatagram {
  uint64 first_sample_index = 1;
  int32 sample_rate = 2;
  uint32 sender_sid = 3;
  uint32 receiver_sid = 4;
  int32 codec = 5;
  bytes datagram = 6;
}

message RxStatusQuery {}

message RxStreamReceipt {
  uint64 epoch = 1;
  int64 frames_written = 2;
  uint64 samples_skipped = 3;
  string state = 4;
  uint64 datagrams_received = 5;
  uint64 datagrams_out_of_order = 6;
  uint64 datagrams_dropped = 7;
  uint64 datagrams_missing = 8;
  string source = 9;
  bool stream_active = 10;
}

 // Read-only station-scoped stream; clients select a known signal, never a mapping name.
service StationSignals {
  rpc Subscribe(StationSignalRequest) returns (stream StationSignalFrame);
}
enum StationSignalKind {
  STATION_SIGNAL_UNKNOWN = 0;
  STATION_SIGNAL_RX_AUDIO = 1;
  STATION_SIGNAL_AF_SPECTRUM = 2;
  STATION_SIGNAL_RF_MAIN = 3;
  STATION_SIGNAL_RF_SUB = 4;
  STATION_SIGNAL_FT4 = 5;
  STATION_SIGNAL_CW = 6;
  STATION_SIGNAL_Q65 = 7;
  STATION_SIGNAL_TELEMETRY = 8;
  STATION_SIGNAL_IQ_CF32 = 9;
  STATION_SIGNAL_RAW_IQ_CF32 = 10;
}
message StationSignalRequest { StationSignalKind kind = 1; }
message StationSignalFrame {
  int64 sequence = 1;
  uint64 epoch = 2;
  uint64 first_sample_index = 3;
  int64 monotonic_ticks = 4;
  int32 sample_rate = 5;
  int32 sample_count = 6;
  bytes payload = 7;
  int64 lost_frames = 8;
  int32 channels = 9;
}

service StationRecorder {
  rpc Start(StationRecordingStart) returns (StationRecordingStatus);
  rpc Status(StationRecordingQuery) returns (StationRecordingStatus);
  rpc Stop(StationRecordingQuery) returns (StationRecordingStatus);
}
message StationRecordingStart { StationSignalKind kind = 1; }
message StationRecordingQuery {}
message StationRecordingStatus {
  bool running = 1;
  string id = 2;
  StationSignalKind kind = 3;
  int64 samples = 4;
  double duration_seconds = 5;
  int32 discontinuities = 6;
  repeated string files = 7;
  string detail = 8;
}
