name: Orekit Installed Runtime Release Gate

on:
  push:
    branches:
      - feature/orekit-ikvm-orbit-engine
    paths:
      - 'SkyRoof/**'
      - 'SkyRoof.Orbit.*/**'
      - 'install/SkyRoof.iss'
      - 'scripts/stage-orekit-backend.ps1'
      - 'scripts/test-installer-payload.ps1'
      - '.github/workflows/orbit-installed-runtime-gate.yml'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: orbit-installed-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-runtime:
    name: Build and execute installed Orekit plugin
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and SkyCAT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Build pinned HamNoise backend
        shell: pwsh
        run: ./scripts/build-hamnoise.ps1

      - name: Download pinned WinDivert x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'WinDivert-2.2.2-A.zip'
          for ($try = 0; $try -lt 3; $try++) {
            try { Invoke-WebRequest $uri -OutFile $zip; break }
            catch { if ($try -eq 2) { throw }; Start-Sleep -Seconds (3 * ($try + 1)) }
          }
          $expected = '63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Pinned WinDivert SHA-256 mismatch'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'windivert-verified'
          Expand-Archive $zip -DestinationPath $unpack -Force
          $dll = Get-ChildItem $unpack -Recurse -File -Filter 'WinDivert.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $sys = Get-ChildItem $unpack -Recurse -File -Filter 'WinDivert64.sys' | Select-Object -First 1
          if (-not $dll -or -not $sys) { throw 'WinDivert x64 payload is incomplete' }
          $dest = 'Vendor/WinDivert/x64'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          Copy-Item $dll.FullName (Join-Path $dest 'WinDivert.dll') -Force
          Copy-Item $sys.FullName (Join-Path $dest 'WinDivert64.sys') -Force

      - name: Restore pinned SkyCAT assets
        run: dotnet restore Vendor/SkyCAT/skycatd/skycatd.csproj --locked-mode

      - name: Locked solution restore
        run: nuget restore SkyRoof.sln -LockedMode

      - name: Build SkyRoof in Release x64
        run: msbuild SkyRoof.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Restore locked Orekit and IKVM graph
        run: dotnet restore SkyRoof.Orbit.Orekit.Smoke/SkyRoof.Orbit.Orekit.Smoke.csproj --locked-mode

      - name: Compile and stage full IKVM runtime
        shell: pwsh
        run: |
          dotnet build SkyRoof.Orbit.Orekit.Smoke/SkyRoof.Orbit.Orekit.Smoke.csproj -c Release --no-restore
          ./scripts/stage-orekit-backend.ps1 -Configuration Release

      - name: Verify Vallado, OMM, UTC and EOP diagnostics
        run: dotnet run --project SkyRoof.Orbit.Orekit.Smoke/SkyRoof.Orbit.Orekit.Smoke.csproj -c Release --no-build --no-restore -- SkyRoof.Orbit.Orekit.Smoke/TestData artifacts/orekit-release/orekit-sgp4-report.json

      - name: Restore installer smoke harness
        run: dotnet restore SkyRoof.Orbit.InstallerSmoke/SkyRoof.Orbit.InstallerSmoke.csproj

      - name: Install Inno Setup
        shell: pwsh
        run: choco upgrade innosetup --yes --no-progress

      - name: Package Windows x64 installation
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "install\SkyRoof.iss"'

      - name: Install and execute Orekit from extracted payload
        shell: pwsh
        run: ./scripts/test-installer-payload.ps1

      - name: Upload test evidence and installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orekit-installed-runtime-release-gate
          path: |
            artifacts/orekit-release/*
            install/Output/SkyRoofSetup.exe
          if-no-files-found: warn
