name: Remote React Dockview Web Build
on:
  push:
    branches: [feature/remote-v1-multiprocess-foundation]
    paths: ['src/SkyRoof.Remote.Web/**','.github/workflows/remote-web-build.yml']
  pull_request:
    paths: ['src/SkyRoof.Remote.Web/**','.github/workflows/remote-web-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install exact frontend dependencies
        working-directory: src/SkyRoof.Remote.Web
        run: npm install --no-audit --no-fund
      - name: Type check and build
        working-directory: src/SkyRoof.Remote.Web
        run: npm run build
