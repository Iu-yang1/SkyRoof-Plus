name: Remote Native WebRTC DataChannel Loopback
on:
  push:
    branches: [feature/remote-v1-multiprocess-foundation]
    paths: ['native/SkyRoof.Media.Native/tests/webrtc/**','native/SkyRoof.Media.Native/rtc/**','.github/workflows/remote-webrtc-datachannel.yml']
  pull_request:
    paths: ['native/SkyRoof.Media.Native/tests/webrtc/**','native/SkyRoof.Media.Native/rtc/**','.github/workflows/remote-webrtc-datachannel.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rtc-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Clone pinned libdatachannel v0.24.7
        run: |
          git clone --recursive --depth 1 --branch v0.24.7 https://github.com/paullouisageneau/libdatachannel.git /tmp/libdatachannel
          test "$(git -C /tmp/libdatachannel rev-parse HEAD)" = "800e849a1ede5667caaf8f6caa1eb21e4906dd87"
      - name: Install Opus codec headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - name: Build real WebRTC C API peers
        run: |
          cmake -S native/SkyRoof.Media.Native/tests/webrtc -B /tmp/skyroof-rtc -DCMAKE_BUILD_TYPE=Release -DLIBDATACHANNEL_SOURCE=/tmp/libdatachannel
          cmake --build /tmp/skyroof-rtc --target skyroof_webrtc_loopback --parallel 2
      - name: Exercise ICE, SDP and DataChannel
        run: ctest --test-dir /tmp/skyroof-rtc --output-on-failure
      - name: Build and exercise deployable native RX bridge
        run: |
          cmake -S native/SkyRoof.Media.Native/rtc -B /tmp/skyroof-rtc-bridge -DCMAKE_BUILD_TYPE=Release -DLIBDATACHANNEL_SOURCE=/tmp/libdatachannel
          cmake --build /tmp/skyroof-rtc-bridge --parallel 2
          ctest --test-dir /tmp/skyroof-rtc-bridge --output-on-failure
  rtc-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build pinned Windows native RX bridge
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch v0.24.7 https://github.com/paullouisageneau/libdatachannel.git "$env:RUNNER_TEMP/libdatachannel"
          if ((git -C "$env:RUNNER_TEMP/libdatachannel" rev-parse HEAD) -ne '800e849a1ede5667caaf8f6caa1eb21e4906dd87') { throw 'Wrong libdatachannel revision' }
          vcpkg install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native/SkyRoof.Media.Native/rtc -B artifacts/rtc -A x64 "-DLIBDATACHANNEL_SOURCE=$env:RUNNER_TEMP/libdatachannel" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/rtc --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir artifacts/rtc -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/rtc-runtime | Out-Null
          Copy-Item artifacts/rtc/Release/skyroof_rtc.dll artifacts/rtc-runtime/
          Copy-Item "$env:RUNNER_TEMP/libdatachannel/LICENSE" artifacts/rtc-runtime/libdatachannel-LICENSE.txt
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/openssl/copyright" artifacts/rtc-runtime/openssl-LICENSE.txt
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libcrypto*.dll" artifacts/rtc-runtime/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libssl*.dll" artifacts/rtc-runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: SkyRoof-RTC-native-win-x64
          path: artifacts/rtc-runtime
