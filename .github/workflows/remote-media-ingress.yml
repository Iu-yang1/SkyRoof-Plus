name: Remote Media Service PCM16 IPC Integration
on:
  push:
    branches: [feature/remote-v1-multiprocess-foundation]
    paths: ['src/SkyRoof.Remote.Media/**','src/SkyRoof.Remote.SignalBus/**','src/SkyRoof.Remote.Ipc.Contracts/**','protocols/ipc/media.proto','tests/SkyRoof.Remote.Media.Integration/**','.github/workflows/remote-media-ingress.yml']
  pull_request:
    paths: ['src/SkyRoof.Remote.Media/**','src/SkyRoof.Remote.SignalBus/**','src/SkyRoof.Remote.Ipc.Contracts/**','protocols/ipc/media.proto','tests/SkyRoof.Remote.Media.Integration/**','.github/workflows/remote-media-ingress.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-source-to-signalbus:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Media Service
        run: dotnet publish src/SkyRoof.Remote.Media/SkyRoof.Remote.Media.csproj -c Release -r win-x64 --self-contained false -o artifacts/remote-media -warnaserror
      - name: Build independent Media test client
        run: dotnet build tests/SkyRoof.Remote.Media.Integration/SkyRoof.Remote.Media.Integration.csproj -c Release -warnaserror
      - name: Run real Media process with PCM16 producer/takeover and shared memory consumer
        run: dotnet run --project tests/SkyRoof.Remote.Media.Integration/SkyRoof.Remote.Media.Integration.csproj -c Release --no-build -- artifacts/remote-media/SkyRoof.Remote.Media.dll
